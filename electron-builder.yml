appId: com.tiligram.desktop
productName: Tiligram
asar: true
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
  - package.json
publish:
  - provider: github
    owner: NTheDrone-come
    repo: tiligram
    releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Tiligram-Setup-${version}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Тилиграм
mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Network
